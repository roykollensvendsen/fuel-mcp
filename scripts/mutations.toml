# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/fuel_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a station beyond the search radius is never chosen"
file = "src/fuel_mcp/service.py"
find = 'near = \[\(p, km\) for p, km in near if km <= radius_km\]'
replace = 'near = list(near)'

[[rule]]
name = "a price older than a day is said as about"
file = "src/fuel_mcp/speech.py"
find = 'if hours >= HOURS_A_DAY:'
replace = 'if False:'

[[rule]]
name = "a copy checked within the hour is used without asking"
file = "src/fuel_mcp/sources/drivstoffpriser.py"
find = 'if checked is not None and now - checked < CHECK_EVERY:'
replace = 'if False:'

[[rule]]
name = "a check sends back the tag from the last answer"
file = "src/fuel_mcp/sources/drivstoffpriser.py"
find = 'ask = \{header: meta\[key\] for header, key in CONDITIONAL'
replace = 'ask: dict[str, str] = {}'

[[rule]]
name = "a fuel price older than 7 days is never said as current"
file = "src/fuel_mcp/service.py"
find = 'current = \[\(p, km\) for p, km in near if now - p.updated_at <= CURRENT_FOR\]'
replace = 'current = list(near)'

[[rule]]
name = "a failing host is not asked again for ten minutes"
file = "src/fuel_mcp/sources/drivstoffpriser.py"
find = 'if self._failed_recently\(now\):'
replace = 'if False:'

[[rule]]
name = "a price time with no offset is read as norwegian time"
file = "src/fuel_mcp/sources/drivstoffpriser.py"
find = 'return moment.replace\(tzinfo=NORWAY\).astimezone\(dt.UTC\)'
replace = 'return moment.replace(tzinfo=dt.UTC)'

[[rule]]
name = "no price source is on until the owner lists one"
file = "src/fuel_mcp/settings.py"
find = 'DEFAULT_SOURCES: tuple\[str, \.\.\.\] = \(\)'
replace = 'DEFAULT_SOURCES: tuple[str, ...] = ("drivstoffpriser",)'

[[rule]]
name = "a station name is read aloud only as one short line"
file = "src/fuel_mcp/speech.py"
find = 'if not candidate or _SENTENCE.search\(candidate\) or len\(candidate.split\(\)\) > NAME_WORDS:'
replace = 'if not candidate:'

[[rule]]
name = "a rough position widens the search by two kilometres at most"
file = "src/fuel_mcp/service.py"
find = 'widen_m = min\(max\(accuracy, 0.0\), WIDEST_ACCURACY_M\)'
replace = 'widen_m = accuracy'

[[rule]]
name = "a broken private file refuses the commit never skips the check"
file = "scripts/private_data_scan.py"
find = 'raise PrivateFileError\(path\) from None'
replace = 'return {}'

[[rule]]
name = "a module with no layer is a breach"
file = "scripts/ratchet.py"
find = 'if layer\(module\) == "unassigned":'
replace = 'if False:'

[[rule]]
name = "an import a layer may not use is a breach"
file = "scripts/ratchet.py"
find = 'if layer\(inside\) not in ALLOWED\[mine\]:'
replace = 'if False:'

[[rule]]
name = "a measure that gets worse fails the check"
file = "scripts/ratchet.py"
find = 'if _worse\(metric, base\[metric\], now\[metric\]\) and metric not in allowed:'
replace = 'if False:'

[[rule]]
name = "when the levels main kept are missing, the base is measured"
file = "scripts/ratchet.py"
find = '^    return measure_base\(\)$'
replace = 'return {}'
